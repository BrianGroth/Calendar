<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Calendar</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <a class="brand" href="#" aria-label="Calendar home">Calendar</a>

      <div class="title-group">
        <button id="titleBtn" class="title-btn" type="button" aria-haspopup="dialog" aria-expanded="false">
          <span id="rangeLabel" class="range-label"></span>
          <svg class="chevron" viewBox="0 0 20 20" aria-hidden="true"><path d="m6 8 4 4 4-4"/></svg>
        </button>
        <div id="datePicker" class="date-picker" hidden>
          <div class="date-picker-year">
            <button id="yearPrev" class="icon-btn compact" type="button" aria-label="Previous year"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m12.5 5-5 5 5 5"/></svg></button>
            <span id="yearLabel" class="year-label"></span>
            <button id="yearNext" class="icon-btn compact" type="button" aria-label="Next year"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m7.5 5 5 5-5 5"/></svg></button>
          </div>
          <div id="monthGrid" class="month-pick-grid"></div>
        </div>
      </div>

      <nav class="month-nav" aria-label="Calendar navigation">
        <button id="todayBtn" class="quiet-btn" type="button">Today</button>
        <button id="prevBtn" class="icon-btn" type="button" aria-label="Previous month"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m12.5 5-5 5 5 5"/></svg></button>
        <button id="nextBtn" class="icon-btn" type="button" aria-label="Next month"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m7.5 5 5 5-5 5"/></svg></button>
      </nav>

      <div class="header-actions">
        <div class="view-toggle" role="tablist" aria-label="Calendar view">
          <button id="monthViewBtn" class="view-btn is-active" type="button" role="tab" aria-selected="true">Month</button>
          <button id="agendaViewBtn" class="view-btn" type="button" role="tab" aria-selected="false">Agenda</button>
        </div>

        <label class="search-wrap">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
          <span class="sr-only">Search events</span>
          <input type="search" id="searchInput" placeholder="Search events" autocomplete="off">
        </label>

        <button id="newEventBtn" class="primary-btn" type="button">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg>
          <span>New event</span>
        </button>

        <div class="menu-wrap">
          <button id="menuBtn" class="icon-btn" type="button" aria-label="More options" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="4" r="1"/><circle cx="10" cy="10" r="1"/><circle cx="10" cy="16" r="1"/></svg></button>
          <div id="menuDropdown" class="menu-dropdown" role="menu" hidden>
            <label class="menu-item" for="importInput" role="menuitem">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 13V3m0 0L6.5 6.5M10 3l3.5 3.5M4 11v5h12v-5"/></svg>
              Import
              <input type="file" id="importInput" accept="application/json" hidden>
            </label>
            <button id="exportBtn" class="menu-item" type="button" role="menuitem">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v10m0 0 3.5-3.5M10 13 6.5 9.5M4 14v2h12v-2"/></svg>
              Export
            </button>
          </div>
        </div>
      </div>
    </header>

    <main class="workspace">
      <section id="monthPanel" class="calendar-panel" aria-label="Month calendar" aria-describedby="calendarScrollHint">
        <p id="calendarScrollHint" class="sr-only">Scroll vertically over the calendar to move between months. Navigation is available from three months ago through twelve months ahead.</p>
        <div class="weekday-row" id="weekdayRow" aria-hidden="true"></div>
        <div id="calendarGrid" class="day-grid-viewport"></div>
      </section>

      <aside id="agendaPanel" class="agenda-panel" aria-label="Upcoming events">
        <div class="agenda-heading">
          <h2>Up next</h2>
          <p id="agendaDate"></p>
        </div>
        <ul id="agendaList" class="agenda-list"></ul>
        <p class="agenda-footnote">Showing the next 8 events</p>
      </aside>

      <section id="agendaFullPanel" class="agenda-full-panel" hidden aria-label="All events">
        <div class="agenda-full-heading">
          <h1>Agenda</h1>
          <p>Every event, in order.</p>
        </div>
        <ul id="agendaFullList" class="agenda-list agenda-list-full"></ul>
      </section>
    </main>

    <nav class="mobile-nav" aria-label="Mobile calendar view">
      <button id="mobileMonthBtn" class="mobile-nav-btn is-active" type="button"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4" width="14" height="13" rx="2"/><path d="M6 2v4M14 2v4M3 8h14M7 11h.01M10 11h.01M13 11h.01M7 14h.01M10 14h.01"/></svg><span>Month</span></button>
      <button id="mobileAgendaBtn" class="mobile-nav-btn" type="button"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 5h10M7 10h10M7 15h10M3 5h.01M3 10h.01M3 15h.01"/></svg><span>Agenda</span></button>
    </nav>
  </div>

  <div id="dayModal" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <div>
          <p class="modal-date" id="modalDateLabel"></p>
          <h2 id="modalTitle">New event</h2>
        </div>
        <button id="closeModal" class="icon-btn" type="button" aria-label="Close dialog"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg></button>
      </div>
      <div class="modal-body">
        <ul id="eventList" class="event-list" aria-label="Events on this day"></ul>
        <form id="eventForm" class="event-form">
          <label class="field field-wide">
            <span>Event name</span>
            <input type="text" id="eventTitle" placeholder="Enter event name" required maxlength="200" autocomplete="off">
          </label>
          <div class="field-row">
            <label class="field">
              <span>Date</span>
              <input type="text" id="eventDateDisplay" readonly>
            </label>
            <label class="field">
              <span>Time <small>(optional)</small></span>
              <input type="time" id="eventTime">
            </label>
          </div>
          <fieldset class="field color-field">
            <legend>Color</legend>
            <select id="eventColor" hidden aria-hidden="true">
              <option value="green">Mint</option>
              <option value="purple">Lavender</option>
              <option value="orange">Amber</option>
              <option value="blue">Sky</option>
              <option value="red">Coral</option>
              <option value="slate">Slate</option>
            </select>
            <div class="color-options" role="group" aria-label="Event color">
              <button class="color-option is-selected" type="button" data-color="green" aria-pressed="true"><span class="color-swatch"></span>Mint</button>
              <button class="color-option" type="button" data-color="purple" aria-pressed="false"><span class="color-swatch"></span>Lavender</button>
              <button class="color-option" type="button" data-color="orange" aria-pressed="false"><span class="color-swatch"></span>Amber</button>
              <button class="color-option" type="button" data-color="blue" aria-pressed="false"><span class="color-swatch"></span>Sky</button>
              <button class="color-option" type="button" data-color="red" aria-pressed="false"><span class="color-swatch"></span>Coral</button>
              <button class="color-option" type="button" data-color="slate" aria-pressed="false"><span class="color-swatch"></span>Slate</button>
            </div>
          </fieldset>
          <div class="event-form-actions">
            <button type="button" id="cancelEditBtn" class="quiet-btn" hidden>Cancel edit</button>
            <button type="button" id="cancelModalBtn" class="quiet-btn">Cancel</button>
            <button type="submit" id="submitEventBtn" class="primary-btn">Save event</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
