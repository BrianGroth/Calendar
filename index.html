<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="toolbar">
      <div class="toolbar-group nav-group">
        <button id="prevBtn" class="icon-btn nav-btn" aria-label="Previous month">&#8249;</button>
        <button id="todayBtn" class="today-btn">Today</button>
        <button id="nextBtn" class="icon-btn nav-btn" aria-label="Next month">&#8250;</button>
      </div>

      <div class="title-group">
        <button id="titleBtn" class="title-btn" aria-haspopup="true" aria-expanded="false">
          <span id="rangeLabel" class="range-label"></span>
          <span class="chevron" aria-hidden="true">&#9662;</span>
        </button>
        <div id="datePicker" class="date-picker" hidden>
          <div class="date-picker-year">
            <button id="yearPrev" class="icon-btn" aria-label="Previous year">&#8249;</button>
            <span id="yearLabel" class="year-label"></span>
            <button id="yearNext" class="icon-btn" aria-label="Next year">&#8250;</button>
          </div>
          <div id="monthGrid" class="month-pick-grid"></div>
        </div>
      </div>

      <div class="toolbar-group toolbar-right">
        <div class="search-wrap">
          <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <input type="search" id="searchInput" placeholder="Search events…" aria-label="Search events">
        </div>

        <div class="view-toggle" role="tablist" aria-label="View">
          <button id="monthViewBtn" class="view-btn is-active" role="tab" aria-selected="true">Month</button>
          <button id="agendaViewBtn" class="view-btn" role="tab" aria-selected="false">Agenda</button>
        </div>

        <div class="menu-wrap">
          <button id="menuBtn" class="icon-btn" aria-label="More options" aria-haspopup="true" aria-expanded="false">&#8942;</button>
          <div id="menuDropdown" class="menu-dropdown" hidden>
            <button id="exportBtn" class="menu-item" type="button">Export events&hellip;</button>
            <label class="menu-item" for="importInput">Import events&hellip;
              <input type="file" id="importInput" accept="application/json" hidden>
            </label>
          </div>
        </div>
      </div>
    </header>

    <main class="layout">
      <section id="monthPanel" class="calendar-panel">
        <div class="weekday-row" id="weekdayRow"></div>
        <div id="calendarGrid" class="day-grid-viewport"></div>
      </section>

      <aside id="agendaPanel" class="agenda-panel" aria-label="Upcoming events">
        <h2 class="agenda-title">Upcoming</h2>
        <ul id="agendaList" class="agenda-list"></ul>
      </aside>

      <section id="agendaFullPanel" class="agenda-full-panel" hidden aria-label="All events">
        <ul id="agendaFullList" class="agenda-list"></ul>
      </section>
    </main>
  </div>

  <div id="dayModal" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <h2 id="modalTitle">Day details</h2>
        <button id="closeModal" class="icon-btn" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <ul id="eventList" class="event-list"></ul>
        <form id="eventForm" class="event-form">
          <input type="text" id="eventTitle" placeholder="Add a detail…" required maxlength="200">
          <div class="event-form-row">
            <input type="time" id="eventTime">
            <select id="eventColor" aria-label="Color tag">
              <option value="blue">Blue</option>
              <option value="green">Green</option>
              <option value="orange">Orange</option>
              <option value="purple">Purple</option>
              <option value="red">Red</option>
            </select>
          </div>
          <div class="event-form-actions">
            <button type="button" id="cancelEditBtn" class="cancel-btn" hidden>Cancel</button>
            <button type="submit" id="submitEventBtn" class="add-btn">Add</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
